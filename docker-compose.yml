services:
  postgres:
    image: postgres:16-alpine
    container_name: gandg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - gandg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gandg-redis
    restart: unless-stopped
    ports:
      # Host 6380 — system Redis already occupies 6379 on this machine
      - "6380:6379"
    volumes:
      - gandg_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gandg_postgres_data:
  gandg_redis_data:
